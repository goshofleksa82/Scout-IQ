name: scoutiq-integration
services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: scoutiq_staging
      POSTGRES_USER: scoutiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a separate staging password in deploy/.env}
    volumes: [scoutiq_staging_data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U scoutiq -d scoutiq_staging']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    env_file: [./deploy/.env]
    environment:
      DATABASE_URL: postgresql+psycopg://scoutiq:${POSTGRES_PASSWORD}@db:5432/scoutiq_staging
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: ./backend
    env_file: [./deploy/.env]
    environment:
      DATABASE_URL: postgresql+psycopg://scoutiq:${POSTGRES_PASSWORD}@db:5432/scoutiq_staging
      PORT: '8001'
      ENVIRONMENT: development
      ALLOWED_HOSTS: api,localhost,127.0.0.1
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      SCOUTIQ_API_ORIGIN: http://api:8001
      SCOUTIQ_DATASET_LABEL: Container integration sandbox
    ports: ['127.0.0.1:5173:8080']
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  scoutiq_staging_data:
