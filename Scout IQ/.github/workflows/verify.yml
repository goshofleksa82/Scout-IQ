name: ScoutIQ verification
on: [push, pull_request, workflow_dispatch]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scoutiq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d scoutiq_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/scoutiq_ci
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/scoutiq_test
      ENVIRONMENT: test
    defaults:
      run: {working-directory: backend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r requirements-dev.txt
      - run: python -c "import secrets,os; open(os.environ['GITHUB_ENV'],'a').write('JWT_SECRET_KEY='+secrets.token_urlsafe(48)+'\n')"
      - run: pytest -q
      - run: docker build -t scoutiq-api-check .
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - run: docker build -t scoutiq-frontend-check .
